apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-system

resources:
  - ../../base

patchesStrategicMerge:
  - cluster-autoscaler-staging-patch.yaml
  - resource-limits-staging-patch.yaml

configMapGenerator:
  - name: environment-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=warn
      - FEATURE_FLAGS=most

commonLabels:
  environment: staging
  tier: staging

replicas:
  - name: kubernetes-dashboard
    count: 2
  - name: prometheus
    count: 1