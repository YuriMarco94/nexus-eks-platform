apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-system

resources:
  - ../../base

patchesStrategicMerge:
  - cluster-autoscaler-prod-patch.yaml
  - resource-limits-prod-patch.yaml

configMapGenerator:
  - name: environment-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=info
      - FEATURE_FLAGS=essential

commonLabels:
  environment: prod
  tier: production

replicas:
  - name: kubernetes-dashboard
    count: 3
  - name: prometheus
    count: 2

images:
  - name: nginx
    newTag: 1.25-alpine