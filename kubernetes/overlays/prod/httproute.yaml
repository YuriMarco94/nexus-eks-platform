apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-demo-prod
  namespace: demo-prod
spec:
  parentRefs:
  - name: nexus-gw
    namespace: nginx-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /prod
    backendRefs:
    - name: nginx-demo
      port: 80
