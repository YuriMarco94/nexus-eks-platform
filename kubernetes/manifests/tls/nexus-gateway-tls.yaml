apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: nginx-gateway
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nexus-gw-tls
  namespace: nginx-gateway
spec:
  secretName: nexus-gw-tls
  dnsNames:
    - nexus.local
  issuerRef:
    name: selfsigned
    kind: Issuer
