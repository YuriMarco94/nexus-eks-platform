# Values para Kubernetes Dashboard com segurança aprimorada
replicaCount: 2

image:
  repository: kubernetesui/dashboard
  tag: v2.7.0
  pullPolicy: IfNotPresent

extraArgs:
  - --enable-skip-login
  - --enable-insecure-login
  - --disable-settings-authorizer

metricsScraper:
  enabled: true

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector:
  node-type: general-purpose

tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kubernetes-dashboard
          topologyKey: kubernetes.io/hostname

service:
  type: ClusterIP
  port: 443
  targetPort: 8443
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

rbac:
  create: true
  clusterAdminRole: false

serviceAccount:
  create: true
  name: kubernetes-dashboard

protocolHttp: false

settings:
  clusterName: "Nexus EKS Cluster"
  itemsPerPage: 10
  defaultNamespace: "default"
  disableAccessDeniedNotifications: true

ingress:
  enabled: false

extraVolumes: []
extraVolumeMounts: []

# Security - PSP replacement com Pod Security Standards
securityContext:
  runAsUser: 1001
  runAsGroup: 2001
  fsGroup: 2001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 2001
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault